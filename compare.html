<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compare · Activity Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#f7f7f5;--panel:#ffffff;--sunken:#f1f1ee;--hover:#f5f5f2;--border:#e7e7e3;--border2:#d5d5d0;--text:#17171a;--muted:#5f5f67;--faint:#8e8e96;--green:#1d8a4b;--purple:#7445d6;--red:#cc3a30;--amber:#a86f05;--green-bg:color-mix(in srgb,var(--green) 11%,transparent);--purple-bg:color-mix(in srgb,var(--purple) 11%,transparent);--red-bg:color-mix(in srgb,var(--red) 10%,transparent);--amber-bg:color-mix(in srgb,var(--amber) 13%,transparent);--hl:color-mix(in srgb,var(--amber) 16%,transparent);--spark:color-mix(in srgb,var(--text) 7%,transparent);--shimmer:#e9e9e5;--shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.08);--shadow-lg:0 2px 6px rgba(0,0,0,.06),0 24px 60px rgba(0,0,0,.16);--c0:oklch(0.33 0.01 270);--c1:oklch(0.42 0.08 262);--c2:oklch(0.66 0.08 215);--c3:oklch(0.76 0.1 85);--c4:oklch(0.62 0.1 30);--c5:oklch(0.58 0.07 155);--c6:oklch(0.72 0.05 310);--py:10px}
html[data-theme=dark]{--bg:#0a0a0b;--panel:#111113;--sunken:#18181b;--hover:#16161a;--border:#232327;--border2:#313137;--text:#ececee;--muted:#a3a3ac;--faint:#73737c;--green:#3fbf73;--purple:#a685f2;--red:#f2675e;--amber:#e3a83a;--shimmer:#222226;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.5);--shadow-lg:0 2px 6px rgba(0,0,0,.4),0 24px 60px rgba(0,0,0,.6);--c0:oklch(0.84 0.01 270);--c1:oklch(0.7 0.09 262);--c2:oklch(0.74 0.08 215);--c3:oklch(0.8 0.1 85);--c4:oklch(0.68 0.11 30);--c5:oklch(0.68 0.08 155);--c6:oklch(0.62 0.05 310)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Geist,ui-sans-serif,system-ui,sans-serif;font-size:13px;line-height:1.4;-webkit-font-smoothing:antialiased;transition:background .2s}
a{color:inherit;text-decoration:none}
a:hover{color:var(--text)}
button,input{font:inherit;color:inherit}
input::placeholder{color:var(--faint)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}

.mono{font-family:'Geist Mono',monospace}
.btn{height:30px;padding:0 10px;display:flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--panel);border-radius:7px;cursor:pointer;font-size:12.5px}
.btn:hover{border-color:var(--border2)}
.seg{display:flex;align-items:center;gap:2px;padding:2px;background:var(--sunken);border:1px solid var(--border);border-radius:7px;height:30px}
.seg>*{height:24px;padding:0 9px;border:none;border-radius:5px;cursor:pointer;font-size:12px;font-weight:500;display:flex;align-items:center;gap:5px;white-space:nowrap;background:transparent;color:var(--muted)}
.seg>.on{background:var(--panel);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.ph{display:flex;align-items:center;gap:10px;padding:11px 14px;flex-wrap:wrap}
.ph.b{border-bottom:1px solid var(--border)}
.row{border-top:1px solid var(--border)}
.hov:hover{background:var(--hover)}
.menu-item{width:100%;height:32px;display:flex;align-items:center;gap:9px;padding:0 9px;border:none;background:transparent;border-radius:6px;cursor:pointer;font-size:12.5px;text-align:left}
.menu-item:hover{background:var(--hover)}
.box{width:14px;height:14px;border-radius:4px;border:1px solid var(--border2);color:var(--bg);display:grid;place-items:center}
.box.on{background:var(--text);border-color:var(--text)}
.sk{background:linear-gradient(90deg,var(--sunken) 30%,var(--shimmer) 50%,var(--sunken) 70%);background-size:200% 100%;animation:shimmer 1.4s linear infinite;border-radius:4px}
.slot{flex:1;min-width:0;text-align:left;padding:7px 10px;border-radius:8px;border:1px solid var(--border);background:var(--sunken);cursor:pointer}
.slot.active{border-color:var(--text)}
.slot small{display:block;font-size:11px;color:var(--faint)}
.slot span{display:block;font-family:'Geist Mono',monospace;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.pick{width:100%;text-align:left;padding:10px 14px;border:none;border-top:1px solid var(--border);background:transparent;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.pick:hover,.pick.on{background:var(--hover)}
.pick b{font-weight:500;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick small{font-size:12px;color:var(--muted)}
.fbtn{width:100%;display:flex;gap:10px;align-items:center;padding:10px 14px;border:none;background:transparent;cursor:pointer;text-align:left}
.fbtn:hover{background:var(--hover)}
.chev{flex:none;color:var(--faint);transition:transform .15s}
.diff{margin:0 14px 12px;border:1px solid var(--border);border-radius:8px;overflow:auto;font-family:'Geist Mono',monospace;font-size:11.5px;line-height:1.5;max-height:70vh}
.diff div{padding:0 10px;white-space:pre;min-width:max-content}
.diff .a{background:var(--green-bg)}.diff .d{background:var(--red-bg)}.diff .h{color:var(--purple);background:var(--sunken)}
.diff .u{display:flex;min-width:max-content;padding:0}
.u .n{flex:none;width:44px;padding:0 8px 0 0;text-align:right;color:var(--faint);user-select:none;-webkit-user-select:none}
.u .n+.n{border-right:1px solid var(--border);margin-right:8px}
.u .t{white-space:pre;padding-right:10px}
.diff.sel-l .sr>div:last-child,.diff.sel-r .sr>div:first-child{user-select:none;-webkit-user-select:none}
.sr .n{user-select:none;-webkit-user-select:none}
.diff.split div{padding:0;white-space:normal;min-width:0}
.sr{display:grid;grid-template-columns:1fr 1fr}
.sr>div{display:flex;min-width:0}.sr>div+div{border-left:1px solid var(--border)}
.sr .n{flex:none;width:38px;padding:0 6px;text-align:right;color:var(--faint);user-select:none}
.sr .t{flex:1;min-width:0;padding:0 8px;white-space:pre-wrap;word-break:break-all}
.sr .a{background:var(--green-bg)}.sr .d{background:var(--red-bg)}.sr .e{background:var(--sunken)}
.sr.h{display:block}.sr.h .t{padding:0 10px}
.diff .hl,.sr.hl>div{box-shadow:inset 3px 0 var(--amber);background:var(--hl)!important}
.cite{border:none;background:var(--hl);color:inherit;border-radius:4px;padding:0 4px;cursor:pointer;font-family:'Geist Mono',monospace;font-size:11.5px}
.fask{flex:none;height:22px;padding:0 7px;border-radius:5px;border:1px solid var(--border);background:var(--panel);font-size:11.5px;color:var(--muted);display:flex;align-items:center}
.fask:hover{color:var(--text);border-color:var(--border2)}
#chat{position:fixed;right:20px;bottom:20px;z-index:40;width:var(--cw,380px);max-width:calc(100vw - 40px);height:var(--ch,min(540px,calc(100vh - 100px)));max-height:calc(100vh - 40px);display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--border2);border-radius:12px;box-shadow:var(--shadow-lg);overflow:hidden}
#chat .rz{position:absolute;z-index:2}
#chat .rz.l{left:-3px;top:12px;bottom:0;width:8px;cursor:ew-resize}
#chat .rz.t{top:-3px;left:12px;right:0;height:8px;cursor:ns-resize}
#chat .rz.c{left:-3px;top:-3px;width:16px;height:16px;cursor:nwse-resize}
#chat .rz:hover,#chat .rz.on{background:color-mix(in srgb,var(--text) 14%,transparent)}
#chat.big .msgs{padding:16px 22px}
#chat .msgs{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px;font-size:13px;line-height:1.5}
.m-u{align-self:flex-end;max-width:85%;min-width:0;background:var(--sunken);border-radius:12px 12px 3px 12px;padding:8px 12px;display:flex;flex-direction:column;gap:4px}
.m-u .t{white-space:pre-wrap;overflow-wrap:anywhere}
.m-u .c{font-family:'Geist Mono',monospace;font-size:11px;color:var(--muted);overflow-wrap:anywhere;line-height:1.35}
.m-a{word-break:break-word;line-height:1.6;display:flex;flex-direction:column;gap:10px;font-size:13px}
.m-a p{margin:0;white-space:pre-wrap}
.m-a h4{margin:4px 0 0;font-size:13px;font-weight:600}
.m-a strong{font-weight:600}
.m-a code{font-family:'Geist Mono',monospace;font-size:11.5px;background:var(--sunken);border:1px solid var(--border);border-radius:5px;padding:1px 5px;white-space:normal;overflow-wrap:anywhere}
.m-a ol,.m-a ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.m-a li{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;background:var(--sunken);border:1px solid var(--border);border-radius:9px}
.m-a li>div{flex:1;min-width:0}
.m-a ul li{padding:0;background:none;border:none;gap:8px}
.m-a ul{gap:5px}
.m-a ol .b{flex:none;width:20px;height:20px;border-radius:50%;background:var(--text);color:var(--bg);font-size:11px;font-weight:600;display:grid;place-items:center;margin-top:1px}
.m-a ul .b{flex:none;width:6px;height:6px;border-radius:50%;background:var(--faint);margin-top:8px;margin-left:5px;margin-right:2px}
.m-a .cite{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:5px;padding:0 5px;cursor:pointer;font-family:'Geist Mono',monospace;font-size:11px;line-height:1.5;overflow-wrap:anywhere;text-align:left}
.m-a .cite:hover{background:var(--hl);border-color:var(--amber)}
.m-a .sha{font-family:'Geist Mono',monospace;font-size:11px;color:var(--purple);background:var(--purple-bg);border-radius:5px;padding:1px 5px}
.m-a .sha:hover{color:var(--purple);text-decoration:underline}
.qk{height:24px;padding:0 9px;border:1px solid var(--border);background:var(--sunken);border-radius:999px;cursor:pointer;font-size:11.5px;color:var(--muted)}
.qk:hover{color:var(--text);border-color:var(--border2)}
.cvdoc h1{font-size:19px;margin:0 0 6px;letter-spacing:-.01em}
.cvdoc h2{font-size:14.5px;margin:20px 0 8px;padding-top:12px;border-top:1px solid var(--border)}
.cvdoc p,.cvdoc li{font-size:13.5px;line-height:1.6}
.cvdoc .m-a{font-size:13.5px}
.ib{width:26px;height:26px;padding:0;justify-content:center;color:var(--muted);flex:none}
.ib:hover{color:var(--text)}
.hi{display:flex;align-items:center;gap:6px;padding:9px 10px;border:1px solid var(--border);border-radius:9px;background:var(--panel);cursor:pointer}
.hi:hover{background:var(--hover)}
.hi.cur{border-color:var(--text)}
.hi .hm{flex:1;min-width:0}
.hi b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hi small{display:block;color:var(--faint);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hi .ib{opacity:0}.hi:hover .ib{opacity:1}
.rn{width:100%;height:24px;border:1px solid var(--border2);border-radius:6px;background:var(--panel);padding:0 6px;font:inherit;font-weight:500;outline:none}
.think{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px;padding:2px 0}
.think .spark{width:14px;height:14px;color:var(--text);animation:pulse 1.4s ease-in-out infinite;flex:none}
.think .dots{display:inline-flex;gap:3px}
.think .dots i{width:4px;height:4px;border-radius:50%;background:var(--faint);animation:bounce 1.2s infinite ease-in-out}
.think .dots i:nth-child(2){animation-delay:.15s}.think .dots i:nth-child(3){animation-delay:.3s}
.think .el{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--faint);font-size:11.5px}
@keyframes pulse{0%,100%{transform:scale(.8) rotate(0);opacity:.5}50%{transform:scale(1.1) rotate(45deg);opacity:1}}
@keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.35}40%{transform:translateY(-3px);opacity:1}}
.caret{display:inline-block;width:6px;height:13px;margin-left:2px;vertical-align:-2px;background:var(--text);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.sug{text-align:left;padding:8px 10px;border:1px solid var(--border);background:var(--panel);border-radius:8px;cursor:pointer;font-size:12.5px}
.sug:hover{background:var(--hover)}
#askPop{position:fixed;z-index:50;display:none;height:28px;padding:0 10px;border-radius:7px;border:none;background:var(--text);color:var(--bg);font-size:12px;font-weight:500;cursor:pointer;box-shadow:var(--shadow)}
.add{color:var(--green)}.del{color:var(--red)}
.empty{padding:48px 20px 52px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
</style>
</head>
<body>
<header style="position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--border)">
  <div style="max-width:1480px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
    <a href="/" style="display:flex;align-items:center;gap:8px;margin-right:10px">
      <div style="width:22px;height:22px;border-radius:6px;background:var(--text);color:var(--bg);display:grid;place-items:center">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 8.5h3l2-5 3 9 2-4h3"></path></svg>
      </div>
      <span style="font-weight:600;font-size:14px;letter-spacing:-.01em;white-space:nowrap">Activity Monitor</span>
    </a>
    <div style="position:relative">
      <button class="btn" id="repoBtn" style="gap:7px">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" style="color:var(--muted)"><path d="M3 13V3.5A1.5 1.5 0 0 1 4.5 2H13v9.5H4.5A1.5 1.5 0 0 0 3 13a1.5 1.5 0 0 0 1.5 1.5H13"></path></svg>
        <span id="repoLabel">Repository</span>
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" style="color:var(--faint)"><path d="M4 6l4 4 4-4"></path></svg>
      </button>
      <div id="repoMenu" style="display:none;position:absolute;top:36px;left:0;z-index:30;width:max-content;min-width:260px;max-width:min(520px,calc(100vw - 40px));background:var(--panel);border:1px solid var(--border2);border-radius:9px;box-shadow:var(--shadow);padding:4px"></div>
    </div>
    <div class="seg">
      <a href="/">Dashboard</a>
      <a class="on" href="/compare">Compare</a>
    </div>
    <div id="scrim" style="display:none;position:fixed;inset:0;z-index:25"></div>
    <div id="scrim2" style="display:none;position:fixed;inset:0;z-index:35"></div>
    <div style="flex:1"></div>
    <div style="display:flex;align-items:center;gap:8px">
      <span style="font-size:12px;color:var(--faint);white-space:nowrap;display:flex;align-items:center;gap:6px"><span id="dot" style="width:6px;height:6px;border-radius:50%;background:var(--green)"></span><span id="synced">Synced just now</span></span>
      <button class="btn" id="refresh" title="Refresh now">
        <svg id="spin" width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"></path><path d="M13.5 2.5v3h-3"></path></svg>
        <span>Refresh</span>
      </button>
      <button class="btn" id="theme" title="Toggle theme" style="width:30px;padding:0;justify-content:center;color:var(--muted)"></button>
    </div>
  </div>
</header>
<main style="max-width:1480px;margin:0 auto;padding:16px 20px 120px;display:flex;flex-direction:column;gap:16px">
  <div style="display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start">
    <div style="flex:1.85 1 600px;min-width:0;display:flex;flex-direction:column;gap:16px">
      <section class="panel">
        <div class="ph b"><span style="font-weight:600">Comparison</span><span id="cmpSub" style="color:var(--muted);font-size:12px"></span><div style="flex:1"></div><a id="gh" target="_blank" style="display:none;font-size:12px;color:var(--muted)">Open on GitHub ↗</a></div>
        <div style="padding:12px 14px;display:flex;gap:8px;align-items:stretch">
          <button class="slot" id="slotA"><small>Base</small><span id="labA"></span></button>
          <button class="btn" id="swap" title="Swap base and compare" style="width:30px;padding:0;justify-content:center;align-self:center;color:var(--muted)">⇄</button>
          <button class="slot" id="slotB"><small>Compare</small><span id="labB"></span></button>
        </div>
      </section>
      <div id="result" style="display:flex;flex-direction:column;gap:16px"></div>
    </div>
    <div id="selCol" style="flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:16px">
      <section class="panel">
        <div class="ph" style="flex-wrap:nowrap"><span style="font-weight:600">Select</span><span id="selCount" style="color:var(--muted);font-size:12px"></span><div style="flex:1"></div><button class="btn" id="selToggle" title="Minimize / expand" style="width:26px;height:26px;padding:0;justify-content:center;color:var(--muted)"></button></div>
        <div id="selBody"><div style="padding:0 14px 10px;display:flex;flex-direction:column;gap:8px">
          <div class="seg" id="tabs"></div>
          <div style="display:flex;gap:8px;position:relative;z-index:36">
            <input id="q" placeholder="Filter…" style="flex:1;min-width:0;height:30px;border:1px solid var(--border);background:var(--panel);border-radius:7px;padding:0 10px;outline:none;font-size:12.5px">
            <button class="btn" id="sortBtn" title="Sort by" style="gap:6px;white-space:nowrap"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="color:var(--muted)"><path d="M5 3v10M2.5 10.5 5 13l2.5-2.5M11 13V3M8.5 5.5 11 3l2.5 2.5"></path></svg><span id="sortLabel"></span></button>
            <div id="sortMenu" style="display:none;position:absolute;top:34px;right:0;width:200px;background:var(--panel);border:1px solid var(--border2);border-radius:9px;box-shadow:var(--shadow);padding:4px"></div>
          </div>
          <span id="hint" style="font-size:12px;color:var(--faint)"></span>
          <label id="cumWrap" style="display:none;font-size:12px;color:var(--muted);align-items:center;gap:6px;cursor:pointer" title="Pick the start and end separately: Base = code before the push you click, Compare = code after the push you click"><input type="checkbox" id="cum"> Range: set only the selected side (Base = before, Compare = after)</label>
        </div>
        <div id="opts"></div></div>
      </section>
    </div>
  </div>
</main>
<div id="cv" style="display:none;position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.4);align-items:center;justify-content:center;padding:20px">
  <div class="panel" style="width:min(760px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column;box-shadow:var(--shadow-lg)">
    <div class="ph b" style="flex-wrap:nowrap"><span style="font-weight:600">Slack canvas</span><span id="cvState" style="color:var(--muted);font-size:12px"></span><div style="flex:1"></div>
      <div class="seg" id="cvTabs"><button data-t="prev" class="on">Preview</button><button data-t="edit">Markdown</button></div>
      <button class="btn ib" id="cvX" title="Close">✕</button></div>
    <div id="cvBody" style="flex:1;min-height:260px;overflow:auto;padding:16px 22px"></div>
    <div id="cvRefine" style="border-top:1px solid var(--border);padding:10px 14px 0">
      <div id="cvSelChip" style="display:none;margin-bottom:8px;padding:5px 8px;border:1px solid var(--border);background:var(--hl);border-radius:8px;font-size:12px;align-items:center;gap:8px"><span style="color:var(--muted)">Editing</span><span id="cvSelText" style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></span><button id="cvSelX" style="border:none;background:none;cursor:pointer;color:var(--muted)">✕</button></div>
      <div style="display:flex;gap:8px;align-items:center;border:1px solid var(--border);border-radius:9px;padding:3px 4px 3px 10px"><input id="cvIn" placeholder="Refine it: e.g. shorten the TL;DR, add a section on tests, make it less technical…" style="flex:1;min-width:0;border:none;outline:none;background:transparent;height:30px;font-size:13px"><button class="btn" id="cvSend" title="Apply" style="width:30px;padding:0;justify-content:center;background:var(--text);color:var(--bg);border:none">↑</button></div>
      <div id="cvQuick" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px"></div>
    </div>
    <div class="ph" style="justify-content:flex-end;flex-wrap:wrap">
      <button class="btn" id="cvRegen" title="Write a fresh version from the chat">Regenerate</button><button class="btn" id="cvUndo" style="display:none">↶ Undo</button><div style="flex:1"></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const plural=(n,w)=>`${n} ${w}${n===1?'':'s'}`;
const STATUS={open:'open',review:'in review',merged:'merged',closed:'closed'};
const GC={open:'var(--purple)',review:'var(--amber)',merged:'var(--green)',closed:'var(--faint)'};
const lsGet=k=>{try{return localStorage.getItem(k)}catch{return null}},lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch{}};
const P=new URLSearchParams(location.search);
const S={data:null,repo:P.get('repo'),a:null,b:null,side:'a',tab:P.get('tab')||'branch',q:'',loading:false,error:null,res:null,open:{},menu:false,sortMenu:false,sorts:(()=>{try{return JSON.parse(lsGet('sorts'))||{}}catch{return {}}})(),selOpen:lsGet('selOpen')!=='0',comOpen:lsGet('comOpen')!=='0',comAll:false,view:lsGet('diffView')==='split'?'split':'unified',chat:{open:false,msgs:[],busy:false,sel:null,file:null,id:null,title:'',created:0,view:'chat',renaming:null},chats:[],hl:null,refreshing:false,syncedAt:Date.now()};
if(P.get('base')&&P.get('head'))S.a={ref:P.get('base'),label:P.get('bl')||P.get('base')},S.b={ref:P.get('head'),label:P.get('hl')||P.get('head')};

// theme (shared with the dashboard via localStorage)
const SUN='<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="3"></circle><path d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1 1M11.6 11.6l1 1M3.4 12.6l1-1M11.6 4.4l1-1"></path></svg>';
const MOON='<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M13.5 9.5A5.5 5.5 0 0 1 6.5 2.5a5.5 5.5 0 1 0 7 7z"></path></svg>';
const theme=()=>{try{return localStorage.getItem('theme')}catch{return null}};
const setTheme=t=>{document.documentElement.dataset.theme=t;$('theme').innerHTML=t==='dark'?SUN:MOON};
setTheme(theme()||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
$('theme').onclick=()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';try{localStorage.setItem('theme',n)}catch{}setTheme(n)};

function syncUrl(){
  const p=new URLSearchParams({repo:S.repo,tab:S.tab});
  if(S.a&&S.b){p.set('base',S.a.ref);p.set('head',S.b.ref);p.set('bl',S.a.label);p.set('hl',S.b.label)}
  history.replaceState(null,'','/compare?'+p);
}
async function run(fresh){
  if(!S.a||!S.b)return render();
  const key=S.repo+S.a.ref+S.b.ref+Date.now();S.key=key;S.loading=true;S.error=null;if(!fresh)S.res=null;S.open={};syncUrl();render();
  try{
    const q=new URLSearchParams({repo:S.repo,base:S.a.ref,head:S.b.ref});if(fresh)q.set('fresh','1');
    const r=await fetch('/api/compare?'+q);
    const j=await r.json();
    if(S.key!==key)return;
    if(!r.ok)throw new Error((j.error||'Compare failed').replace(/^gh: /,'').replace(/\s*\(HTTP \d+\)\s*$/,''));
    S.res=j;if(j.files.length===1)S.open[0]=true;
  }catch(e){if(S.key!==key)return;S.error=e.message;S.res=null}
  S.loading=false;render();
}
const pickRef=(ref,label)=>{const o=S.side==='a'?'b':'a';S[S.side]={ref,label};if(!S[o])S.side=o;S.res=null;run()};
const pickPR=p=>{S.a={ref:p.baseSha||p.base,label:`#${p.n} base (${p.base||'base'})`};S.b={ref:p.headSha||p.branch,label:`#${p.n} ${p.branch}`};run()};
const pickPush=e=>{
  const cs=e.commits,f=cs[cs.length-1].sha,l=cs[0].sha;
  if(!S.one){S.a={ref:f+'^',label:'before '+f};S.b={ref:l,label:`${l} (${e.branch})`};run();return}
  // Range mode: the Base slot takes the code before the push, the Compare slot the code after it.
  if(S.side==='a')S.a={ref:f+'^',label:'before '+f};else S.b={ref:l,label:`after ${l} (${e.branch})`};
  const o=S.side==='a'?'b':'a';if(!S[o])S.side=o;S.res=null;run()};
const person=login=>(S.data.people[login]||{}).name||login;

const SORTS={
  branch:[['recent','Recently updated'],['oldest','Least recently updated'],['az','Name A–Z'],['za','Name Z–A']],
  pr:[['new','Newest first'],['old','Oldest first'],['size','Most changes'],['status','Status']],
  push:[['new','Newest first'],['old','Oldest first'],['commits','Most commits']]};
const curSort=()=>{const v=S.sorts[S.tab];return SORTS[S.tab].some(x=>x[0]===v)?v:SORTS[S.tab][0][0]};
function options(){
  const d=S.data,q=S.q.toLowerCase(),hit=t=>!q||t.toLowerCase().includes(q);
  if(S.tab==='branch')return d.branches.filter(b=>b.repo===S.repo&&hit(b.name)).sort((a,b)=>{const k=curSort();return k==='az'?a.name.localeCompare(b.name):k==='za'?b.name.localeCompare(a.name):(b.def-a.def)||(k==='oldest'?a.date-b.date:b.date-a.date)}).map(b=>({t:b.name,s:(b.def?'default · ':'')+(b.date?'updated '+rel(b.date)+' ago':''),mono:1,on:S[S.side]&&S[S.side].ref===b.name,go:()=>pickRef(b.name,b.name)}));
  if(S.tab==='pr')return d.prs.filter(p=>p.repo===S.repo&&hit(`#${p.n} ${p.title}`)).sort((a,b)=>{const k=curSort(),O={open:0,review:1,merged:2,closed:3};return k==='old'?a.n-b.n:k==='size'?(b.adds+b.dels)-(a.adds+a.dels):k==='status'?(O[a.status]-O[b.status])||b.n-a.n:b.n-a.n}).map(p=>({t:p.title,n:'#'+p.n,dot:GC[p.status],s:`${STATUS[p.status]} · ${person(p.by)} · +${p.adds} −${p.dels}`,go:()=>pickPR(p)}));
  return d.events.filter(e=>e.repo===S.repo&&e.type==='push'&&e.commits&&e.commits.length&&hit(e.commits[0].msg+' '+e.branch)).sort((a,b)=>{const k=curSort();return k==='old'?a.ts-b.ts:k==='commits'?b.commits.length-a.commits.length||b.ts-a.ts:b.ts-a.ts}).slice(0,80).map(e=>({t:e.commits[0].msg,s:`${e.branch} · ${person(e.author)} · ${plural(e.commits.length,'commit')} · ${rel(e.ts)} ago`,go:()=>pickPush(e)}));
}
const CHEV='<svg class="chev" width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" style="transform:@@R@@"><path d="M6 4l4 4-4 4"></path></svg>';
const sk=(w,h,extra='')=>`<div class="sk" style="width:${w};height:${h}px;${extra}"></div>`;

function unifiedRows(lines){
  let o=0,n=0;
  const row=(c,a,b,t,nl)=>`<div class="u ${c}"${nl!=null?` data-nl="${nl}"`:''}><span class="n">${a??''}</span><span class="n">${b??''}</span><span class="t">${esc(t)||' '}</span></div>`;
  return lines.map(t=>{
    if(t[0]==='@'){const m=/^@@ -(\d+)(?:,\d+)? \+(\d+)/.exec(t);if(m){o=+m[1];n=+m[2]}return `<div class="h">${esc(t)}</div>`}
    if(t[0]==='-')return row('d',o++,'',t);
    if(t[0]==='\\')return `<div>${esc(t)}</div>`;
    if(t[0]==='+')return row('a','',n,t,n++);
    return row('',o++,n,t,n++);
  }).join('');
}
// Pairs removed/added lines of a unified patch into left (old) / right (new) cells.
function splitRows(lines){
  const cell=(n,t,c,nl)=>`<div class="${c}"${nl!=null?` data-nl="${nl}"`:''}><span class="n">${n??''}</span><span class="t">${esc(t)}</span></div>`;
  let o=0,nw=0,del=[],add=[],out='';
  const flush=()=>{const m=Math.max(del.length,add.length);for(let i=0;i<m;i++){const d=del[i],a=add[i];out+=`<div class="sr">${d?cell(d[0],d[1],'d'):cell('','','e')}${a?cell(a[0],a[1],'a',a[0]):cell('','','e')}</div>`}del=[];add=[]};
  for(const t of lines){
    if(t[0]==='@'){flush();const m=/^@@ -(\d+)(?:,\d+)? \+(\d+)/.exec(t);if(m){o=+m[1];nw=+m[2]}out+=`<div class="sr h"><div class="h"><span class="t">${esc(t)}</span></div></div>`}
    else if(t[0]==='-')del.push([o++,t.slice(1)]);
    else if(t[0]==='+')add.push([nw++,t.slice(1)]);
    else if(t[0]==='\\')continue;
    else{flush();const x=t.slice(1);out+=`<div class="sr">${cell(o++,x,'')}${cell(nw,x,'',nw++)}</div>`}
  }
  flush();return out;
}
const COM_LIMIT=8;
function render(){
  renderChat();
  const d=S.data;
  $('repoLabel').textContent=S.repo||'Repository';
  $('repoMenu').style.display=S.menu?'block':'none';$('scrim').style.display=S.menu?'block':'none';
  $('repoMenu').innerHTML=d.repos.map(r=>`<button class="menu-item" data-r="${esc(r)}"><span class="box ${r===S.repo?'on':''}">${r===S.repo?'<svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-7"></path></svg>':''}</span><span class="mono" style="flex:1;font-size:12px">${esc(r)}</span></button>`).join('');
  $('repoMenu').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.repo=b.dataset.r;S.a=S.b=null;S.res=null;S.error=null;S.side='a';S.menu=false;syncUrl();render()});
  $('sortLabel').textContent=SORTS[S.tab].find(x=>x[0]===curSort())[1];
  $('sortMenu').style.display=S.sortMenu?'block':'none';$('scrim2').style.display=S.sortMenu?'block':'none';
  $('sortMenu').innerHTML=SORTS[S.tab].map(([k,l])=>`<button class="menu-item" data-k="${k}"><span style="flex:1">${l}</span>${k===curSort()?'<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-7"></path></svg>':''}</button>`).join('');
  $('sortMenu').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.sorts[S.tab]=b.dataset.k;lsSet('sorts',JSON.stringify(S.sorts));S.sortMenu=false;render()});
  $('selBody').style.display=S.selOpen?'block':'none';
  $('selCol').style.cssText=S.selOpen?'flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:16px':'flex:0 0 190px;min-width:0;display:flex;flex-direction:column;gap:16px';
  $('selToggle').innerHTML=`<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="transform:${S.selOpen?'rotate(180deg)':'none'}"><path d="M4 6l4 4 4-4"></path></svg>`;
  $('labA').textContent=S.a?S.a.label:'Choose…';$('labB').textContent=S.b?S.b.label:'Choose…';
  $('slotA').classList.toggle('active',S.side==='a');$('slotB').classList.toggle('active',S.side==='b');
  const res=S.res;
  $('cmpSub').textContent=res?`${plural(res.files.length,'file')} · ${plural(res.total,'commit')}`:'';
  const gh=$('gh');gh.style.display=res?'block':'none';if(res)gh.href=res.url;
  $('tabs').innerHTML=[['branch','Branches'],['pr','Pull requests'],['push','Pushes']].map(([k,l])=>`<button class="${S.tab===k?'on':''}" data-k="${k}" style="flex:1;justify-content:center">${l}</button>`).join('');
  $('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.tab=b.dataset.k;S.q='';$('q').value='';syncUrl();render()});
  $('hint').textContent=S.tab==='branch'?'Selecting for: '+(S.side==='a'?'Base':'Compare'):S.tab==='pr'?'Fills both sides with the pull request’s changes.':(S.one?'Base takes the code before the push, Compare the code after it. Selecting for: '+(S.side==='a'?'Base':'Compare'):'Fills both sides with the commits in that push.');
  $('cumWrap').style.display=S.tab==='push'?'flex':'none';$('cum').checked=!!S.one;
  $('cum').onchange=()=>{S.one=$('cum').checked;render()};
  const o=options();$('selCount').textContent=o.length;
  const box=$('opts');
  box.innerHTML=o.length?'':'<div style="border-top:1px solid var(--border);padding:28px 14px;text-align:center;color:var(--muted)">Nothing matches</div>';
  o.forEach(x=>{const b=document.createElement('button');b.className='pick'+(x.on?' on':'');
    b.innerHTML=`<div style="display:flex;gap:6px;align-items:baseline;justify-content:space-between"><b class="${x.mono?'mono':''}" ${x.mono?'style="font-size:12px"':''}>${esc(x.t)}</b>${x.n?`<span class="mono" style="flex:none;font-size:11.5px;color:var(--faint)">${x.n}</span>`:''}</div><small>${x.dot?`<span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${x.dot};margin-right:6px"></span>`:''}${esc(x.s)}</small>`;b.onclick=x.go;box.append(b)});

  const r=$('result');
  if(S.loading&&!res){r.innerHTML=`<section class="panel"><div class="ph">${sk('90px',12)}</div>${[60,80,45,70].map(w=>`<div class="row" style="padding:12px 14px;display:flex;flex-direction:column;gap:8px">${sk(w+'%',11)}<div style="width:40%;height:9px;border-radius:4px;background:var(--sunken)"></div></div>`).join('')}</section>`;return}
  if(S.error){r.innerHTML=`<section class="panel"><div class="empty"><div style="width:36px;height:36px;border-radius:9px;background:var(--red-bg);border:1px solid var(--border);color:var(--red);display:grid;place-items:center"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="6.25"></circle><path d="M8 4.75V8.5M8 10.9v.1"></path></svg></div><span style="font-weight:600;font-size:14px">Couldn’t compare these</span><span style="color:var(--muted);max-width:420px;text-wrap:pretty;white-space:pre-wrap">${esc(S.error)}</span></div></section>`;return}
  if(!res){r.innerHTML=`<section class="panel"><div class="empty"><div style="width:36px;height:36px;border-radius:9px;background:var(--sunken);border:1px solid var(--border);color:var(--faint);display:grid;place-items:center"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="4" cy="3.5" r="1.75"></circle><circle cx="4" cy="12.5" r="1.75"></circle><circle cx="12" cy="12.5" r="1.75"></circle><path d="M4 5.25v5.5M12 10.75V6.5a2 2 0 0 0-2-2H7M8.5 3 7 4.5 8.5 6"></path></svg></div><span style="font-weight:600;font-size:14px">Pick something to compare</span><span style="color:var(--muted);max-width:380px;text-wrap:pretty">Choose a base and a compare ref, or pick a pull request or push to fill both sides.</span></div></section>`;return}
  const adds=res.files.reduce((a,f)=>a+f.a,0),dels=res.files.reduce((a,f)=>a+f.d,0);
  const st=res.status==='identical'?'No differences':res.ahead&&res.behind?`${res.ahead} ahead, ${res.behind} behind`:res.ahead?`${res.ahead} ahead`:res.behind?`${res.behind} behind`:'';
  let h='';

// Small markdown subset: **bold**, `code`, numbered / bulleted lists, paragraphs. Safe on partial (streaming) text.
function inline(t){

  const spans=[];
  t=t.replace(/`[^`\n]+`/g,m=>{spans.push(m.slice(1,-1));return '\u0000'+(spans.length-1)+'\u0000'});

function md(text){

  let para=[];const fp=()=>{if(para.length){out.push(`<p>${inline(para.join('\n'))}</p>`);para=[]}};
  for(const line of text.replace(/\r/g,'').split('\n')){
    let m;
    if(!line.trim()){fp();flush();continue}
    if(m=/^\s*(\d+)[.)]\s+(.*)/.exec(line)){fp();if(!list||list.t!=='ol'){flush();list={t:'ol',items:[]}}list.items.push({n:m[1],s:m[2]});continue}
    if(m=/^\s*[-*•]\s+(.*)/.exec(line)){fp();if(!list||list.t!=='ul'){flush();list={t:'ul',items:[]}}list.items.push({s:m[1]});continue}
    if(m=/^#{1,4}\s+(.*)/.exec(line)){fp();flush();out.push(`<h4>${inline(m[1])}</h4>`);continue}
    if(list&&/^\s+\S/.test(line)){list.items[list.items.length-1].s+=' '+line.trim();continue}
    flush();para.push(line);
  }

}

    if(slack)line=line.replace(/(^|[^*\w])\*(?![\s*])([^*\n]+?)\*(?![*\w])/g,'$1_$2_');

    if($('cvTa').value!==CV.text)$('cvTa').value=CV.text;
  }else{
    body.innerHTML=`<div class="cvdoc">${CV.text?cvDocHtml(CV.text)+(CV.busy?'<span class="caret"></span>':''):thinking('canvas',CV.t0||Date.now())}</div>`;tickThinking();
    body.querySelectorAll('.cite').forEach(b=>b.onclick=()=>{$('cv').style.display='none';jumpTo(b.dataset.p,+b.dataset.a,+b.dataset.b)});
  }
}
async function genCanvas(refine){
  const c=S.chat,my=++CV.gen,before=CV.text;
  if(refine){CV.prev=before;CV.text=''}else{CV.prev=null;CV.text=''}
  CV.busy=true;CV.t0=Date.now();cvRender();
  if(!S.a||!S.b){CV.busy=false;CV.text='Pick a comparison first.';return cvRender()}
  const history=c.msgs.filter(m=>!m.err&&!m.live).map(m=>({role:m.role==='user'?'user':'assistant',text:m.text}));
  const question=refine
    ?`Here is the current canvas:\n<<<\n${before}\n>>>\n\n`+(refine.sel?`The user highlighted this part of it:\n"""\n${refine.sel}\n"""\nApply the instruction to THAT part only and leave the rest unchanged.\n\n`:'')+`Instruction: ${refine.text}\n\nReturn the complete updated canvas as Markdown, in the same structure, changing only what the instruction asks for. Output the document only, no preamble.`
    :'Write the canvas now. Give it a short, descriptive title that names the subject (for example the feature or area being reviewed); do not reuse the user\'s question as the title.';
  let failed=null;
  try{
    const r=await fetch('/api/ask-compare',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({repo:S.repo,base:S.a.ref,head:S.b.ref,baseLabel:S.a.label,headLabel:S.b.label,canvas:true,question,history})});
    if(!r.ok)throw new Error((await r.json()).error||'Request failed');
    const rd=r.body.getReader(),dec=new TextDecoder();let buf='',raf=0;
    for(;;){
      const {value,done}=await rd.read();if(done)break;
      buf+=dec.decode(value,{stream:true});let i;
      while((i=buf.indexOf('\n'))>=0){const l=buf.slice(0,i);buf=buf.slice(i+1);if(!l)continue;const j=JSON.parse(l);if(j.error)throw new Error(j.error);
        if(j.d&&my===CV.gen){CV.text+=j.d;if(!raf)raf=requestAnimationFrame(()=>{raf=0;if(CV.tab==='prev')cvRender()})}}
    }
  }catch(e){failed=e.message}
  if(my!==CV.gen)return;
  if(failed){
    if(refine){CV.text=before;CV.prev=null;toast('Could not apply: '+failed)}
    else CV.text=(CV.text?CV.text+'\n\n':'')+'(Could not finish: '+failed+')';
  }
  CV.busy=false;cvRender();
}

}

async function doExport(kind){

function toast(t){
  let el=$('toast');if(!el){el=document.createElement('div');el.id='toast';el.style.cssText='position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:120;pointer-events:none;background:var(--text);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:12.5px;box-shadow:var(--shadow-lg);transition:opacity .2s';document.body.append(el)}

}
function openChat(){S.chat.open=true;S.chat.view='chat';renderChat();setTimeout(()=>$('chatIn').focus(),30)}
async function send(text){
  const c=S.chat;text=(text??$('chatIn').value).trim();
  if(!text||c.busy)return;
  $('chatIn').value='';
  if(!S.a||!S.b||!S.res){c.msgs.push({role:'user',text},{role:'ai',err:1,text:'Pick something to compare first.'});return renderChat()}
  const ctx=c.sel?`${c.sel.path} (highlighted)`:c.file?c.file:'';
  const history=c.msgs.filter(x=>!x.err).slice(-8).map(x=>({role:x.role==='user'?'user':'assistant',text:x.text}));
  if(!c.id){c.id='c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);c.created=Date.now();c.title=text.replace(/\s+/g,' ').slice(0,48)+(text.length>48?'…':'')}
  c.msgs.push({role:'user',text,ctx});c.busy=true;c.t0=Date.now();renderChat();
  try{
    const r=await fetch('/api/ask-compare',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({repo:S.repo,base:S.a.ref,head:S.b.ref,baseLabel:S.a.label,headLabel:S.b.label,question:text,history,selection:c.sel,file:c.file})});
    if(!r.ok)throw new Error((await r.json()).error||'Request failed');
    const m={role:'ai',text:'',live:true};c.msgs.push(m);
    const rd=r.body.getReader(),dec=new TextDecoder();let buf='',raf=0;
    const paint=()=>{raf=0;renderChat()};
    for(;;){
      const {value,done}=await rd.read();if(done)break;
      buf+=dec.decode(value,{stream:true});let i;
      while((i=buf.indexOf('\n'))>=0){
        const l=buf.slice(0,i);buf=buf.slice(i+1);if(!l)continue;
        const j=JSON.parse(l);if(j.error)throw new Error(j.error);
        if(j.d){m.text+=j.d;c.busy=false;if(!raf)raf=requestAnimationFrame(paint)}
      }
    }
    m.live=false;if(!m.text.trim())throw new Error('Empty answer');
  }catch(e){const last=c.msgs[c.msgs.length-1];if(last&&last.live&&last.text){last.live=false;last.text+='\n\n(stopped: '+e.message+')'}else{if(last&&last.live)c.msgs.pop();c.msgs.push({role:'ai',err:1,text:'Could not get an answer: '+e.message})}}
  c.busy=false;c.sel=null;c.file=null;renderChat();persist();
}
